name: TALEVENT Windows - sviluppo
on:
  workflow_dispatch:
  push:
    branches:
      - codex/talevent-windows
    paths:
      - 'talevent/**'
      - '.github/workflows/talevent-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test motore
        run: python -m unittest discover -s talevent -p "test_*.py" -v
      - name: Install packaging dependencies
        run: pip install -r talevent/requirements-build.txt
      - name: Create standalone development executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TALEVENT --paths talevent talevent/app.py
      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: TALEVENT-Windows-development
          path: dist/TALEVENT.exe
          if-no-files-found: error
